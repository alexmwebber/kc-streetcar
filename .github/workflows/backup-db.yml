name: Backup Database

on:
  schedule:
    - cron: "0 9 * * *" # daily at 09:00 UTC
  workflow_dispatch: {} # allows manually triggering a backup on demand

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Uses Neon's *direct* (non-pooled) connection string - PgBouncer's
      # transaction pooling mode (used by the app's -pooler connection)
      # doesn't reliably support everything pg_dump relies on.
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
        run: |
          pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > backup-$(date +%Y%m%d-%H%M%S).sql.gz

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.sql.gz
          retention-days: 30
