name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

# id-token: write is required for OIDC login to Azure (no stored secret -
# GitHub mints a short-lived token proving "this is a run of this repo/branch"
# and Azure trusts it via the federated credential we set up).
permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/alexmwebber/kc-streetcar-backend:${{ github.sha }}
            ghcr.io/alexmwebber/kc-streetcar-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image to Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              -n kc-streetcar-api -g kc-streetcar \
              --image ghcr.io/alexmwebber/kc-streetcar-backend:${{ github.sha }}
